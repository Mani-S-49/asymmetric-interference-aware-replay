phase:
  id: phase_0_onboarding
  seed: 42
  output_root: results/phase_0_onboarding
model:
  name: meta-llama/Llama-3.2-1B
  num_labels: 2
  max_length: 256
datasets:
  english:
    name: stanfordnlp/imdb
    config: null
    text_column: text
    label_column: label
    train_split: train
    test_split: test
    train_size: 2000
    test_size: 500
    shuffle_seed: 42
  hindi:
    name: mteb/indic_sentiment
    config: hi
    text_column: text
    label_column: label
    label_text_column: label_text
    train_split: train
    test_split: test
    swap_train_test: true
    train_size: null
    test_size: null
    positive_label: Positive
    negative_label: Negative
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  bias: none
training:
  learning_rate: 0.0002
  epochs_english: 3
  epochs_hindi: 3
  train_batch_size: 2
  eval_batch_size: 2
  gradient_accumulation_steps: 8
  weight_decay: 0.0
  logging_steps: 10
  eval_strategy: epoch
  save_strategy: epoch
  gradient_checkpointing: true
  max_grad_norm: 1.0
  warmup_ratio: 0.0
  fp16: true
  bf16: false
  report_to: none
  dataloader_num_workers: 2
evaluation:
  f1_average: binary
reproducibility:
  deterministic: true
  seed: 42
